name: Monkeytype Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Monkeytype Readme
        uses: monkeytype-hub/monkeytype-readme@v1.0.0
        with:
          username: codebyumar
          github-token: ${{ secrets.GITHUB_TOKEN }}
          theme: midnight
